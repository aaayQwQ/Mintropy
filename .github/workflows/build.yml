name: Build Mintropy MC Server

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Build with Maven
      run: |
        mvn clean package -DskipTests
        echo "Maven构建完成"
    
    - name: List build output
      run: |
        echo "构建产物:"
        ls -la target/*.jar
    
    - name: Extract API classes
      run: |
        mkdir -p lib
        cd target/classes
        # 提取插件API接口类
        jar cf ../../lib/plugin-server-api.jar \
          PluginServer\$Plugin.class \
          PluginServer\$CommandExecutor.class \
          PluginServer\$ServerAPI.class
        cd ../..
        echo "API库创建完成"
        ls -la lib/
    
    - name: Rename server JAR
      run: |
        # 找到主JAR文件（不是original的）
        MAIN_JAR=$(ls target/*.jar | grep -v original | head -1)
        cp "$MAIN_JAR" mintropy-server.jar
        echo "服务器JAR: $MAIN_JAR -> mintropy-server.jar"
        ls -la mintropy-server.jar
    
    - name: Upload server JAR
      uses: actions/upload-artifact@v4
      with:
        name: mintropy-server
        path: mintropy-server.jar
        retention-days: 90
    
    - name: Upload API library
      uses: actions/upload-artifact@v4
      with:
        name: plugin-server-api
        path: lib/plugin-server-api.jar
        retention-days: 90
    
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Mintropy MC Server v${{ github.run_number }}
        body: |
          ## Mintropy MC 服务器
          
          ### 构建信息
          - 构建编号: ${{ github.run_number }}
          - 提交: ${{ github.sha }}
          - MC版本: 1.20.4
          
          ### 文件说明
          - `mintropy-server.jar` - 服务器主程序
          - `plugin-server-api.jar` - 插件开发API
          
          ### 使用方法
          ```bash
          # 运行服务器
          java -jar mintropy-server.jar
          
          # 开发插件
          javac -cp plugin-server-api.jar YourPlugin.java
