name: Build Mintropy MC Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Compile
      run: |
        mkdir -p build
        javac -encoding UTF-8 -d build src/PluginServer.java
    
    - name: Package JAR
      run: |
        cd build
        echo "Main-Class: PluginServer" > MANIFEST.MF
        jar cfm mintropy-server.jar MANIFEST.MF *.class
        cd ..
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: mintropy-server
        path: build/mintropy-server.jar
